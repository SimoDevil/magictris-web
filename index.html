<script>

  function fadeEl(el, durationMs) {
    el.style.transition = `opacity ${durationMs}ms ease`;
    requestAnimationFrame(() => { el.style.opacity = 1; });
  }
  function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

  // Scrive il testo: ritaglio e posizione della matita calcolati insieme, stesso principio del disegno.
  function writeTextWithPencil(pencilGroup, textEl, clipRect, durationMs, onDone) {
    const bbox = textEl.getBBox();
    clipRect.setAttribute("x", bbox.x - 4);
    clipRect.setAttribute("y", bbox.y - 10);
    clipRect.setAttribute("height", bbox.height + 20);
    clipRect.setAttribute("width", 0);

    const py = bbox.y + bbox.height * 0.62;
    const x0 = bbox.x - 2;
    const xW = bbox.width + 6;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / durationMs);
      clipRect.setAttribute("width", Math.max(0, bbox.width * t + 8));
      const x = x0 + xW * t;
      const y = py + Math.sin(t * Math.PI * 3.2) * 7;
      pencilGroup.setAttribute("transform", `translate(${x},${y}) rotate(32)`);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  async function playIntro() {
    const pencilText = document.getElementById("pencilText");

    // --- La matita scrive "Fiabe" (font corsivo vero, ritaglio e matita sincronizzati) ---
    const fiabeText = document.getElementById("fiabeText");
    const textClipRect = document.getElementById("textClipRect");

    await wait(200);
    fadeEl(pencilText, 150);
    playIntroMusic();
    await wait(120);

    await new Promise((resolve) => {
      writeTextWithPencil(pencilText, fiabeText, textClipRect, 1650, resolve);
    });

    pencilText.style.transition = "opacity .3s ease";
    pencilText.style.opacity = 0;

    fadeEl(document.getElementById("brandSub"), 700);
    await wait(400);
    fadeEl(document.getElementById("tapHint"), 600);
    await wait(2000);
  }

  function stopIntroMusic() {
    if (audioCtx) {
      audioCtx.close().catch(() => {});
      audioCtx = null;
    }
  }

  playIntro().then(() => {
    const overlay = document.getElementById("introOverlay");
    if (overlay) { overlay.classList.add("hidden"); setTimeout(() => overlay.remove(), 600); }
    stopIntroMusic();
  });

  document.getElementById("introOverlay").addEventListener("click", (e) => {
    const overlay = document.getElementById("introOverlay");
    overlay.classList.add("hidden");
    setTimeout(() => overlay.remove(), 600);
    stopIntroMusic();
  });

  // --- Musichetta di sottofondo, ripetuta per coprire tutta la durata ---
  let audioCtx = null;
  function playIntroMusic() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;

      function playNote(freq, startTime, duration, gainPeak, wave) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave || "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + duration * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      // Sting pulito e universale: tre note che salgono (accordo maggiore) + un "ding" finale morbido
      let t0 = ctx.currentTime + 0.05;
      const triad = [523.25, 659.25, 783.99]; // Do-Mi-Sol
      const noteGap = 0.14;
      triad.forEach((freq) => {
        playNote(freq, t0, 0.4, 0.12, "triangle");
        t0 += noteGap;
      });

      // Ding finale: nota più alta, timbro dolce, sfuma lentamente
      playNote(1046.50, t0 + 0.05, 0.9, 0.09, "sine");
      playNote(1046.50 * 2, t0 + 0.05, 0.5, 0.03, "sine");
    } catch (e) {
      console.warn("Audio non disponibile:", e);
    }
  }

  // Se il browser ha bloccato l'audio automatico, un tocco lo sblocca —
  // riprende lo STESSO contesto già programmato, non ne crea uno nuovo.
  document.body.addEventListener("click", () => {
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }, { once: true });

</script>

  { id: "random" },
];

function traitEnding(trait, gender) {
  return trait.invariant ? "e" : gender === "maschio" ? "o" : "a";
}
function traitLabel(trait, gender) {
  if (trait.id === "random") return "Sorpresa";
  const word = trait.base + traitEnding(trait, gender);
  return word.charAt(0).toUpperCase() + word.slice(1);
}
function traitWord(trait, gender) {
  if (trait.id === "random") return null;
  return trait.base + traitEnding(trait, gender);
}

function pronounsFor(gender) {
  const m = gender === "maschio";
  return {
    art: m ? "un" : "una",
    artDef: m ? "il" : "la",
    noun: m ? "bambino" : "bambina",
    nounPl: m ? "bambini" : "bambine",
    altri: m ? "altri" : "altre",
    obj: m ? "gli" : "le",

    stessa: m ? "stesso" : "stessa",
    scelta: m ? "scelto" : "scelta",
    nata: m ? "nato" : "nata",
    determinataAgg: m ? "determinato" : "determinata",
    eroina: m ? "eroe" : "eroina",
  };
}

}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function shade(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + Math.round(255 * percent);
  let g = ((num >> 8) & 0xff) + Math.round(255 * percent);
  let b = (num & 0xff) + Math.round(255 * percent);
  r = Math.max(Math.min(255, r), 0);
  g = Math.max(Math.min(255, g), 0);
  b = Math.max(Math.min(255, b), 0);
  return "#" + ((r << 16) | (g << 8) | b).toString(16).padStart(6, "0");
}

/* ---------------------------------------------------------
   ILLUSTRAZIONE: ogni fiaba riceve, per ciascun paragrafo, un
   pannello disegnato al volo in stile cartone animato, componendo
   uno sfondo (luogo), la protagonista e i personaggi di quella
   scena. Non è generazione fotografica: è illustrazione vettoriale
   creata combinando forme, nello stesso spirito dei testi.
--------------------------------------------------------- */
function starPoints(cx, cy, rOuter, rInner, spikes = 5) {
  let pts = [];
  const step = Math.PI / spikes;
  let rot = -Math.PI / 2;
  for (let i = 0; i < spikes; i++) {
    pts.push(`${cx + Math.cos(rot) * rOuter},${cy + Math.sin(rot) * rOuter}`);
    rot += step;
    pts.push(`${cx + Math.cos(rot) * rInner},${cy + Math.sin(rot) * rInner}`);
    rot += step;
  }
  return pts.join(" ");
}

function faceAt(cx, cy, spread = 9) {
  const eyeR = Math.max(3.6, spread * 0.42);
  return (
    <>
      <circle cx={cx - spread} cy={cy} r={eyeR + 1.6} fill="#fff" stroke="#2A2540" strokeWidth="1.2" />
      <circle cx={cx + spread} cy={cy} r={eyeR + 1.6} fill="#fff" stroke="#2A2540" strokeWidth="1.2" />
      <circle cx={cx - spread} cy={cy + 0.6} r={eyeR} fill="#2A2540" stroke="none" />
      <circle cx={cx + spread} cy={cy + 0.6} r={eyeR} fill="#2A2540" stroke="none" />
      <circle cx={cx - spread + 1.3} cy={cy - 0.8} r={eyeR * 0.4} fill="#fff" stroke="none" />
      <circle cx={cx + spread + 1.3} cy={cy - 0.8} r={eyeR * 0.4} fill="#fff" stroke="none" />
      <circle cx={cx - spread - 3} cy={cy + 6} r="3.2" fill="#F5A6A0" opacity=".55" stroke="none" />
      <circle cx={cx + spread + 3} cy={cy + 6} r="3.2" fill="#F5A6A0" opacity=".55" stroke="none" />
      <path d={`M${cx - 6},${cy + 9} Q${cx},${cy + 14} ${cx + 6},${cy + 9}`} fill="none" stroke="#7A4A2A" strokeWidth="2" strokeLinecap="round" />
    </>
  );
}

const ELEMENT_KEYWORDS = Object.entries(ELEMENT_SYNONYMS)
  .flatMap(([canonical, words]) => words.map((w) => [w, canonical]))
  .sort((a, b) => b[0].length - a[0].length);

function normalizeWord(str) {
  return str
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/^(un|una|uno|il|la|lo|gli|le|l'|a|an|the|le|la|les|un|une|el|la|los|las)\s+/i, "")
    .trim();
}

function matchElementIcon(word) {
  const norm = normalizeWord(word || "");
  for (const [syn, canonical] of ELEMENT_KEYWORDS) {
    if (norm.includes(normalizeWord(syn))) return ELEMENT_ICONS[canonical];
  }
  return null;
}

function hashPastel(word) {
  const palette = ["#F2895F", "#F6D186", "#BEE3F0", "#BCE3CE", "#F2AFC0", "#C9A268", "#8A6FC9"];
  let h = 0;
  for (let i = 0; i < word.length; i++) h = (h * 31 + word.charCodeAt(i)) % 997;
  return palette[Math.abs(h) % palette.length];
}

function ElementBadge({ word, x, y, scale = 1 }) {
  const icon = matchElementIcon(word);
  if (icon) {
    return (
      <g transform={`translate(${x},${y}) scale(${scale})`}>
        <g transform="translate(-50,-58) scale(1.15)">{icon}</g>
      </g>
    );
  }
  const color = hashPastel(word || "?");
  const dark = shade(color, -0.2);
  return (
    <g transform={`translate(${x},${y}) scale(${scale})`}>
      <g stroke="#2A2540" strokeWidth="3" strokeLinecap="round" fill="none">
        <path d="M-18,18 Q-30,26 -32,38" />
        <path d="M18,18 Q30,26 32,38" />
        <path d="M-14,26 Q-16,40 -10,46" />
        <path d="M14,26 Q16,40 10,46" />
      </g>
      <path
        d="M-30,8 Q-34,-26 0,-30 Q34,-26 30,8 Q30,26 0,29 Q-30,26 -30,8 Z"
        fill={color}
        stroke="#2A2540"
        strokeWidth="2.5"
      />
      <path d="M0,-30 Q-4,-40 2,-46" stroke="#2A2540" strokeWidth="2.5" fill="none" strokeLinecap="round" />
      <circle cx="3" cy="-47" r="4" fill={dark} stroke="#2A2540" strokeWidth="2" />
      {faceAt(0, -6, 9)}
    </g>
  );
}

/* ---------------------------------------------------------
   IMMAGINE IA VERA (Pollinations.ai, gratuita, senza chiave):
   genera un'illustrazione reale per la scena; se fallisce o va
   in timeout, ripiega sul disegno SVG come rete di sicurezza.
--------------------------------------------------------- */
function buildImagePrompt(sceneText, elements, placeLabel) {
  const style = "cute 3D cartoon illustration, big expressive eyes, warm soft lighting, children's storybook cover art, vibrant colors";
  const cast = (elements || []).filter(Boolean).join(" and ");
  return `${style}. Book cover illustration showing ${cast} together, standing in ${placeLabel}, as the main characters of the story, fully integrated into the scene and environment.`;
}

function AiImage({ sceneText, elements, placeId, placeLabel, fallbackSection, traitColor, delayIndex = 0 }) {
  const [status, setStatus] = useState(delayIndex === 0 ? "loading" : "pending");
  const [seed] = useState(() => Math.floor(Math.random() * 100000));
  const prompt = buildImagePrompt(sceneText, elements, placeLabel);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=640&height=330&seed=${seed}`;

  useEffect(() => {
    if (delayIndex === 0) return;
    const startTimer = setTimeout(() => setStatus((s) => (s === "pending" ? "loading" : s)), delayIndex * 4000);
    return () => clearTimeout(startTimer);
  }, []);

  useEffect(() => {
    if (status !== "loading") return;
    const timeout = setTimeout(() => setStatus((s) => (s === "loading" ? "error" : s)), 20000);
    return () => clearTimeout(timeout);
  }, [status, url]);

  if (status === "error") {
    return <StoryPanel section={fallbackSection} placeId={placeId} generic elements={elements} traitColor={traitColor} />;
  }

  return (
    <div className="ai-image-wrap">
      {status !== "ready" && (
        <div className="ai-image-loading">
          <span className="ai-image-spark">✨</span>
        </div>
      )}
      {status !== "pending" && (
        <img
          src={url}
          alt="Illustrazione della fiaba"
          className="panel ai-image"
          style={{ display: status === "ready" ? "block" : "none" }}
          onLoad={() => setStatus("ready")}
          onError={() => setStatus("error")}
          crossOrigin="anonymous"
        />
      )}
    </div>
  );
}

  function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const timeout = setTimeout(() => {
        reject(new Error("Timeout: " + src + " non si è caricato in tempo."));
      }, 8000);
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => {
        clearTimeout(timeout);
        resolve();
      };
      s.onerror = () => {
        clearTimeout(timeout);
        reject(new Error("Impossibile caricare " + src));
      };
      document.body.appendChild(s);
    });
  }

  function withTimeout(promise, ms, message) {

  function safeJsonParse(raw) {
    try {

      let cleaned = raw.replace(/[\n\r\t]/g, " ");
      cleaned = cleaned.replace(/\\(?!["\\/bfnrtu])/g, "\\\\");
      return JSON.parse(cleaned);

  }

  function svgElementToPngDataUrl(svgEl, width, height) {
    return new Promise((resolve, reject) => {
      try {
        const svgData = new XMLSerializer().serializeToString(svgEl);
        const svg64 = btoa(unescape(encodeURIComponent(svgData)));
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/png"));
        };
        img.onerror = reject;
        img.src = "data:image/svg+xml;base64," + svg64;
      } catch (e) {
        reject(e);
      }
    });
  }

  async function imgUrlToDataUrl(url) {
    const response = await fetch(url);
    const blob = await response.blob();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

      const ttsResponse = await withTimeout(

          method: "POST",

      const audio = new Audio(`https://freetts.org/api/audio/${data.file_id}`);
      audio.onended = () => setSpeaking(false);
      audio.onerror = () => setSpeaking(false);
      audioRef.current = audio;
      await audio.play();
      setSpeaking(true);
    } catch (e) {

        setGenError(t.errorPrefix + "Nessuna voce disponibile su questo dispositivo.");
        setAudioLoading(false);
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = TTS_LOCALE[lang] || "it-IT";
      const chosenVoice = voices.find((v) => v.name === selectedVoiceName);
      if (chosenVoice) utter.voice = chosenVoice;
      utter.rate = 0.95;
      utter.pitch = 1.05;
      utter.onend = () => setSpeaking(false);

    } finally {

  const firstParagraph = paragraphs ? paragraphs[0].items[0].text : "";
  const firstLetter = firstParagraph.charAt(0);
  const restOfFirstParagraph = firstParagraph.slice(1);

  if (registrationLoaded && !isRegistered) {
    return (
      <div className="app-root">
        <style>{CSS}</style>
        <div className="reg-screen">
          <div className="reg-card">
            <p className="eyebrow">Generatore di fiabe</p>
            <h1>
              Ogni bambino merita <em>una storia tutta sua</em>
            </h1>
            <p className="reg-intro">Prima di iniziare, presentati: bastano nome ed email.</p>
            <label className="field">
              <span>Il tuo nome</span>
              <input
                type="text"
                placeholder="Es. Simone"
                value={regName}
                onChange={(e) => setRegName(e.target.value)}
                maxLength={40}
              />
            </label>
            <label className="field">
              <span>La tua email</span>
              <input
                type="email"
                placeholder="Es. nome@esempio.com"
                value={regEmail}
                onChange={(e) => setRegEmail(e.target.value)}
                maxLength={80}
              />
            </label>
            {regError && <p className="gen-error">⚠️ {regError}</p>}
            <label className="reg-consent-check">
              <input
                type="checkbox"
                checked={regConsent}
                onChange={(e) => setRegConsent(e.target.checked)}
              />
              <span>
                Confermo di avere almeno 18 anni (o di essere genitore/tutore) e accetto la{" "}
                <a href="./privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                {" "}e i{" "}
                <a href="./termini.html" target="_blank" rel="noopener noreferrer">Termini di Servizio</a>.
              </span>
            </label>
            <button className="cta" onClick={completeRegistration}>
              Inizia a creare fiabe ✨
            </button>
            <p className="reg-fineprint">
              Usiamo questi dati solo per riconoscerti su questo dispositivo. Non li condividiamo con nessuno.
            </p>
            <button type="button" className="admin-skip" onClick={skipRegistrationAsAdmin}>
              Sei l'amministratore? Salta la registrazione
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className={"app-root" + (eveningMode ? " evening" : "")}>
      <style>{CSS}</style>

      <div className="sky">
        <svg className="bunting" viewBox="0 0 400 60" preserveAspectRatio="none">
          <path d="M0,6 Q200,30 400,6" fill="none" stroke="#D9BFA0" strokeWidth="2" />
          {BUNTING_FLAGS.map((f, i) => (
            <polygon
              key={i}
              points={`${f.x - 14},${f.y} ${f.x + 14},${f.y} ${f.x},${f.y + 26}`}
              fill={f.color}
            />
          ))}
        </svg>
        {STARS.map((s, i) => (
          <span
            key={i}
            className="star"
            style={{ top: s.top, left: s.left, animationDelay: s.delay, fontSize: s.size }}
          >
            ✦
          </span>
        ))}
      </div>

      <header className="hero hero--compact">
        <p className="eyebrow">{t.eyebrow}</p>
        <h1>
          {t.titlePre}
          <em>{t.titleEm}</em>
        </h1>
      </header>

      {view === "library" && (
        <main className="layout">
          <section className="form-card library-screen">
            <button type="button" className="cta create-cta" onClick={() => setView("create")}>
              {t.ctaCreate}
            </button>
            <h2 className="screen-title">{t.libraryTitle}</h2>
            {savedStories.filter((s) => s.favorite && (!s.profileId || s.profileId === activeProfileId)).length === 0 ? (
              <p className="muted">{t.libraryEmpty}</p>
            ) : (
              <ul className="library-list">
                {savedStories
                  .filter((s) => s.favorite && (!s.profileId || s.profileId === activeProfileId))
                  .sort((a, b) => b.id - a.id)
                  .map((s) => (
                  <li key={s.id} className="library-item">
                    <div className="library-item-info">
                      <strong>{s.storyTitle || (s.elementsUsed || []).join(", ") || s.chapters[0].title}</strong>
                      <span className="library-item-date">{new Date(s.id).toLocaleDateString()}</span>
                    </div>
                    <div className="library-item-actions">
                      <button type="button" className="library-fav" onClick={() => toggleFavorite(s.id)}>
                        {s.favorite ? t.favoriteOn : t.favoriteOff}
                      </button>
                      <button type="button" onClick={() => openStoryFromLibrary(s)}>{t.libraryOpen}</button>
                      <button type="button" className="library-delete" onClick={() => deleteStoryFromLibrary(s.id)}>{t.libraryDelete}</button>
                    </div>
                  </li>
                ))}
              </ul>
            )}
          </section>
        </main>
      )}

      {showPremium && (
        <div className="library-overlay" onClick={() => setShowPremium(false)}>
          <div className="library-panel" onClick={(e) => e.stopPropagation()}>
            <div className="library-panel-header">
              <h2>{t.premiumTitle}</h2>
              <button type="button" className="library-close" onClick={() => setShowPremium(false)}>
                {t.libraryClose} ✕
              </button>
            </div>
            <p className="muted" style={{ marginBottom: ".9rem" }}>{t.premiumSubtitle}</p>
            <ul className="premium-list">
              {t.premiumFeatures.map((f, i) => (
                <li key={i}>✨ {f}</li>
              ))}
            </ul>
            {!isPremium && (
              <div className="premium-plans">
                <button
                  type="button"
                  className={"premium-plan" + (premiumPlan === "monthly" ? " premium-plan--active" : "")}
                  onClick={() => setPremiumPlan("monthly")}
                >
                  <span className="premium-plan-name">Mensile</span>
                  <span className="premium-plan-price">1,50€<small>/mese</small></span>
                </button>
                <button
                  type="button"
                  className={"premium-plan" + (premiumPlan === "yearly" ? " premium-plan--active" : "")}
                  onClick={() => setPremiumPlan("yearly")}
                >
                  <span className="premium-plan-badge">Risparmi il 17%</span>
                  <span className="premium-plan-name">Annuale</span>
                  <span className="premium-plan-price">15€<small>/anno</small></span>
                  <span className="premium-plan-note">= 1,25€/mese</span>
                </button>
              </div>
            )}
            {isPremium ? (
              <>
                <p className="premium-active-note">
                  {t.premiumActive}
                  <br />
                  <small>Piano {premiumPlan === "yearly" ? "annuale (15€/anno)" : "mensile (1,50€/mese)"}</small>
                </p>
                <button type="button" className="cta premium-reset-btn" onClick={() => setPremium(false)}>
                  {t.premiumReset}
                </button>
              </>
            ) : (
              <button type="button" className="cta" onClick={() => setPremium(true, premiumPlan)}>
                {t.premiumUnlock} — {premiumPlan === "yearly" ? "15€/anno" : "1,50€/mese"}
              </button>
            )}
          </div>
        </div>
      )}

      <main className={"layout layout--" + view}>
        {view === "profile" && (
        <section className="form-card">
          <h2 className="screen-title">👤 {t.premiumButton.replace("💎 ", "")}</h2>

          {profiles.length > 0 && (
            <div className="profile-switch">
              {profiles.map((p) =>
                editingProfileId === p.id ? (
                  <span key={p.id} className="profile-add-form">
                    <input
                      type="text"
                      value={editProfileName}
                      onChange={(e) => setEditProfileName(e.target.value)}
                      maxLength={20}
                      autoFocus
                    />
                    <button type="button" onClick={confirmRenameProfile}>{t.profileConfirm}</button>
                    <button type="button" onClick={cancelRenameProfile}>{t.profileCancel}</button>
                  </span>
                ) : (
                  <span key={p.id} className="profile-group">
                    <button
                      type="button"
                      className={"chip chip--sm" + (activeProfileId === p.id ? " chip--active" : "")}
                      onClick={() => setActiveProfileId(p.id)}
                      title={p.name}
                    >
                      🧒 {p.name}
                    </button>
                    <button type="button" className="profile-icon-btn" onClick={() => startRenameProfile(p)} title={t.profileRename}>
                      ✏️
                    </button>
                    {profiles.length > 1 && (
                      <button type="button" className="profile-icon-btn" onClick={() => deleteProfile(p.id)} title={t.profileDelete}>
                        🗑
                      </button>
                    )}
                  </span>
                )
              )}
              {addingProfile ? (
                <span className="profile-add-form">
                  <input
                    type="text"
                    value={newProfileName}
                    onChange={(e) => setNewProfileName(e.target.value)}
                    placeholder={t.profileNamePlaceholder}
                    maxLength={20}
                    autoFocus
                  />
                  <button type="button" onClick={addProfile}>{t.profileConfirm}</button>
                  <button type="button" onClick={() => { setAddingProfile(false); setNewProfileName(""); }}>{t.profileCancel}</button>
                </span>
              ) : profiles.length >= 3 ? null : (
                <button
                  type="button"
                  className="chip chip--sm"
                  onClick={() => (isPremium || profiles.length < 1 ? setAddingProfile(true) : setShowPremium(true))}
                >
                  {t.profileAdd}
                  {!isPremium && profiles.length >= 1 && " 🔒"}
                </button>
              )}
            </div>
          )}

          <div className="profile-screen-row">
            <button
              type="button"
              className={"chip" + (eveningMode ? " chip--active" : "")}
              onClick={() => (isPremium ? setEveningOverride(eveningMode ? false : true) : setShowPremium(true))}
            >
              {eveningMode ? "🌙 Modalità sera attiva" : "☀️ Modalità sera"}
              {!isPremium && " 🔒"}
            </button>
          </div>

          <button type="button" className="cta premium-chip" onClick={() => setShowPremium(true)}>
            {isPremium ? "💎 Sei Premium" : t.premiumButton}
          </button>

          <p className="muted" style={{ fontSize: ".82rem", marginTop: "1.2rem" }}>
            Le fiabe sono scritte gratis, senza bisogno di nessuna chiave o account.
          </p>

          <p className="muted" style={{ fontSize: ".78rem", marginTop: "1rem" }}>
            <a href="./privacy.html" target="_blank" rel="noopener noreferrer">Informativa sulla Privacy</a>
            {"  ·  "}
            <a href="./termini.html" target="_blank" rel="noopener noreferrer">Termini di Servizio</a>
          </p>

          <button type="button" className="delete-data-btn" onClick={deleteAllMyData}>
            🗑 Cancella tutti i miei dati
          </button>
          <p className="muted" style={{ fontSize: ".72rem", marginTop: ".3rem" }}>
            Cancella registrazione, profili e fiabe salvate su questo dispositivo. Non si può annullare.
          </p>
        </section>
        )}

        {view === "create" && (
        <section className="form-card" aria-label="Crea la tua fiaba">
          <p className="form-intro">{t.formIntro}</p>

          <label className="field">
            <span>{t.field1}</span>
            <input
              type="text"
              placeholder={t.ph1}
              value={elem1}
              onChange={(e) => setElem1(e.target.value)}
              maxLength={40}
            />
          </label>

          <label className="field">
            <span>{t.field2}</span>
            <input
              type="text"
              placeholder={t.ph2}
              value={elem2}
              onChange={(e) => setElem2(e.target.value)}
              maxLength={40}
            />
          </label>

          <label className="field">
            <span>{t.field3}</span>
            <input
              type="text"
              placeholder={t.ph3}
              value={elem3}
              onChange={(e) => setElem3(e.target.value)}
              maxLength={40}
            />
          </label>

          <fieldset className="field">
            <legend>{t.ageLabel}</legend>
            <div className="chips">
              {["1-2", "3-5", "6-8"].map((r) => (
                <button
                  key={r}
                  type="button"
                  className={"chip" + (ageRange === r ? " chip--active" : "")}
                  onClick={() => setAgeRange(r)}
                >
                  {t["age" + r.replace("-", "_")]}
                </button>
              ))}
            </div>
          </fieldset>

          {genError && <p className="gen-error">⚠️ {genError}</p>}
          <button className="cta" onClick={handleGenerate} disabled={loading}>
            {loading ? t.ctaLoading : paragraphs ? t.ctaAnother : t.ctaCreate}
          </button>
          {loading && (
            <div className="book-loader">
              <div className="book-loader-book">
                <div className="book-cover left"></div>
                <div className="book-cover right"></div>
                <div className="flip-page p1"></div>
                <div className="flip-page p2"></div>
                <div className="flip-page p3"></div>
              </div>
              <p className="book-loader-text">{LOADING_PHRASES[loadingPhrase]}</p>
            </div>
          )}
        </section>
        )}

        {view === "story" && (
        <section className="page-wrap" aria-live="polite">
          <button type="button" className="back-btn" onClick={() => setView("create")}>
            ← {t.ctaCreate}
          </button>
          <div className={"page" + (flip ? " page--flip" : "")}>
            {loading ? (
              <div className="book-loader">
                <div className="book-loader-book">
                  <div className="book-cover left"></div>
                  <div className="book-cover right"></div>
                  <div className="flip-page p1"></div>
                  <div className="flip-page p2"></div>
                  <div className="flip-page p3"></div>
                </div>
                <p className="book-loader-text">{paragraphs ? t.ctaContinueLoading : t.ctaLoading}</p>
              </div>
            ) : !paragraphs ? (
              <div className="page-empty">
                <span className="page-empty-glyph">📖</span>
                <p>{t.emptyTitle}</p>
                {genError ? (
                  <p className="gen-error">⚠️ {genError}</p>
                ) : (
                  <p className="muted">{t.emptyMuted}</p>
                )}
              </div>
            ) : (
              <>
                {genError && <p className="gen-error">⚠️ {genError}</p>}
                <button className="listen full-listen-btn" onClick={toggleSpeech} disabled={audioLoading}>
                  {audioLoading
                    ? "⏳ Preparo la voce…"
                    : speaking
                    ? t.stop
                    : lastReadChapterCount > 0 && lastReadChapterCount < paragraphs.length
                    ? "🔊 Ascolta il nuovo capitolo"
                    : t.listen}
                </button>
                {storyTitle && <h1 className="story-title">{storyTitle}</h1>}
                <StoryPanel
                  section={paragraphs[0].items[0].section}
                  placeId={placeUsed}
                  generic
                  elements={elementsUsed}
                  traitColor="#E8934A"
                />
                {voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith(lang)).length > 1 && (
                  <select
                    className="voice-picker"
                    value={selectedVoiceName}
                    onChange={(e) => setSelectedVoiceName(e.target.value)}
                  >
                    {voices
                      .filter((v) => v.lang && v.lang.toLowerCase().startsWith(lang))
                      .map((v) => (
                        <option key={v.name} value={v.name}>
                          {v.name}
                        </option>
                      ))}
                  </select>
                )}
                {paragraphs.map((chapter, ci) => (
                  <div key={ci} className="chapter">
                    <h3 className="chapter-title">{chapter.title}</h3>
                    {chapter.items.map((item, pi) => (
                      <div key={pi} className="story-block">
                        {ci === 0 && pi === 0 ? (
                          <p className="story-first">
                            <span className="drop-cap">{firstLetter}</span>
                            {restOfFirstParagraph}
                          </p>
                        ) : (
                          <p className="story-p">{item.text}</p>
                        )}
                      </div>
                    ))}
                  </div>
                ))}
                <div className="morale">
                  <p className="morale-title">{t.moraleTitle}</p>
                  <ul>
                    {moraleExtra && <li>{moraleExtra}</li>}
                  </ul>
                </div>
                <div className="page-toolbar">
                  <button
                    className="listen continue-btn"
                    onClick={() => (isPremium ? continueStory() : setShowPremium(true))}
                    disabled={loading}
                  >
                    {loading ? t.ctaContinueLoading : t.ctaContinue}
                    {!isPremium && " 🔒"}
                  </button>
                  <div className="toolbar-row">
                    <button
                      className={"listen fav-toggle" + ((savedStories.find((s) => s.id === currentStoryId) || {}).favorite ? " fav-toggle--active" : "")}
                      onClick={() => currentStoryId && toggleFavorite(currentStoryId)}
                    >
                      {(savedStories.find((s) => s.id === currentStoryId) || {}).favorite ? t.favoriteOn : t.favoriteOff}
                    </button>
                    <button className="listen" onClick={exportToHTML} disabled={pdfExporting}>
                      {pdfExporting ? t.ctaExportingPdf : t.ctaExportHtml}
                    </button>
                  </div>
                </div>
                <a
                  className="report-btn"
                  href={`mailto:simonevarie2020@gmail.com?subject=${encodeURIComponent(
                    "Segnalazione fiaba: " + (elementsUsed || []).join(", ")
                  )}&body=${encodeURIComponent(
                    "Descrivi qui il problema riscontrato con questa fiaba:\n\nSe puoi, allega anche uno screenshot per aiutarci a capire meglio.\n\n\n---\nElementi: " +
                      (elementsUsed || []).join(", ")
                  )}`}
                >
                  🚩 Segnala un problema
                </a>
              </>
            )}
          </div>
        </section>
        )}
      </main>

      {view !== "story" && (
        <nav className="bottom-nav">
          <button type="button" className={view === "library" ? "active" : ""} onClick={() => setView("library")}>
            <span className="bottom-nav-icon">📚</span>
            <span>{t.navLibrary}</span>
          </button>
          <button type="button" className={view === "create" ? "active" : ""} onClick={() => setView("create")}>
            <span className="bottom-nav-icon">✨</span>
            <span>{t.navCreate}</span>
          </button>
          <button type="button" className={view === "profile" ? "active" : ""} onClick={() => setView("profile")}>
            <span className="bottom-nav-icon">👤</span>
            <span>{t.navProfile}</span>
          </button>
        </nav>
      )}
    </div>
  );
}

const STARS = Array.from({ length: 14 }).map((_, i) => ({
  top: `${Math.random() * 50}%`,
  left: `${Math.random() * 100}%`,
  delay: `${(Math.random() * 4).toFixed(2)}s`,
  size: `${7 + Math.random() * 8}px`,
}));

const BUNTING_COLORS = ["#F2895F", "#F6D186", "#BEE3F0", "#BCE3CE", "#F2AFC0"];
const BUNTING_FLAGS = Array.from({ length: 13 }).map((_, i) => ({
  x: 20 + i * 30,
  y: 6 + Math.sin(i * 0.9) * 10,
  color: BUNTING_COLORS[i % BUNTING_COLORS.length],
}));

const CSS = `
:root{
  --wall-a:#FDF3E6;
  --wall-b:#F8E3C8;
  --wood:#C68A54;
  --wood-dark:#8B5A2B;
  --coral:#F2895F;
  --coral-soft:#F7B79A;
  --butter:#F6D186;
  --sky-soft:#BEE3F0;
  --mint:#BCE3CE;
  --rose:#F2AFC0;
  --ink:#4A3626;
  --ink-soft:#8A6F55;
  --parchment:#FBF3E3;
  --parchment-edge:#EAD6AE;
  --forest:#6B8F5E;
}
*{box-sizing:border-box;}
.app-root{
  min-height:100vh;
  background:
    radial-gradient(circle, rgba(255,255,255,.55) 2px, transparent 2.5px) 0 0/44px 44px,
    radial-gradient(circle, rgba(255,255,255,.4) 1.5px, transparent 2px) 22px 22px/44px 44px,
    linear-gradient(160deg, var(--wall-a) 0%, var(--wall-b) 100%);
  font-family:'Cormorant Garamond', serif;
  color:var(--ink);
  padding:0 0 3rem;
  position:relative;
  overflow-x:hidden;
  transition:filter .6s ease;
}

  filter:brightness(.74) saturate(.82) sepia(.14) hue-rotate(-6deg);
}
@media (prefers-reduced-motion: reduce){ .app-root{ transition:none; } }
.sky{position:absolute; inset:0; height:200px; overflow:hidden; pointer-events:none;}
.bunting{ display:block; width:100%; height:64px; }
.star{position:absolute; color:var(--coral); opacity:.55; animation:twinkle 3.2s ease-in-out infinite;}
@keyframes twinkle{ 0%,100%{opacity:.2; transform:scale(.85);} 50%{opacity:.6; transform:scale(1.1);} }
@media (prefers-reduced-motion: reduce){ .star{animation:none; opacity:.4;} }

  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
}

}
.reg-card .eyebrow{ text-align:center; }
.reg-card h1{ text-align:center; font-size:1.4rem; margin-bottom:.6rem; }
.reg-intro{ text-align:center; color:var(--ink-soft); font-family:'Cormorant Garamond',serif; margin-bottom:1.3rem; }
.reg-fineprint{ font-size:.75rem; color:var(--ink-soft); text-align:center; margin-top:.9rem; line-height:1.4; }
.reg-consent-check{
  display:flex; align-items:flex-start; gap:.55rem; margin:.9rem 0;
  font-family:'Quicksand',sans-serif; font-size:.8rem; color:var(--ink-soft); text-align:left; line-height:1.4;
}
.reg-consent-check input{ margin-top:.2rem; width:18px; height:18px; flex-shrink:0; accent-color:var(--coral); }
.reg-consent-check a{ color:var(--coral); text-decoration:underline; }
.reg-fineprint a{ color:var(--coral); text-decoration:underline; }
.key-saved-badge{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.8rem; color:#3E6B3F;
  background:rgba(107,143,94,.12); border-radius:10px; padding:.5rem .7rem; margin:.4rem 0;
}

  display:block; width:100%; text-align:center; margin-top:1rem; background:none; border:none;

  text-underline-offset:2px; cursor:pointer;
}
.delete-data-btn{
  display:block; width:100%; text-align:center; margin-top:1.4rem;
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.85rem;
  padding:.6rem 1rem; border-radius:16px; border:3px solid #C0453B; cursor:pointer;
  background:#FFF3F1; color:#C0453B;

.hero--compact h1{ font-size:1.5rem; }

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; justify-content:space-around;
  background:#FFFDF8; border-top:3px solid var(--ink);
  padding:.5rem 0 calc(.5rem + env(safe-area-inset-bottom, 0));
  box-shadow:0 -4px 12px rgba(0,0,0,.12);
}
.bottom-nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:.15rem;
  background:none; border:none; cursor:pointer; padding:.3rem;
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.72rem; color:var(--ink-soft);
}
.bottom-nav button.active{ color:var(--coral); }
.bottom-nav-icon{ font-size:1.4rem; }
.app-root{ padding-bottom:80px; }

.screen-title{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:1.3rem;
  color:var(--ink); margin:0 0 1rem;
}
.create-cta{ margin-bottom:1.3rem; }
.library-screen .library-list{ margin-top:0; }

.profile-screen-row{ margin:1.2rem 0; }

.cover-wrap{ position:relative; }
.listen-overlay-btn{
  position:absolute; top:.6rem; right:.6rem; z-index:5;
  width:44px; height:44px; border-radius:12px; border:3px solid var(--ink); cursor:pointer;
  background:linear-gradient(135deg, var(--sky-soft), var(--mint)); color:var(--ink);
  font-size:1.15rem; display:flex; align-items:center; justify-content:center;
  box-shadow:2px 3px 0 var(--ink);
}
.listen-overlay-btn:active{ transform:translate(2px,3px); box-shadow:0 0 0 var(--ink); }

.eyebrow{ font-family:'Quicksand',sans-serif; letter-spacing:.14em; text-transform:uppercase; font-size:.72rem; color:var(--coral); margin:0 0 .8rem; font-weight:700;}
.hero h1{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:2.15rem; line-height:1.25; margin:0 0 1rem; color:var(--ink);}
.hero h1 em{ font-style:italic; color:var(--coral);}
.lede{ font-size:1rem; line-height:1.6; color:var(--ink-soft); margin:0;}

.layout{
  position:relative;
  max-width:620px;
  margin:1rem auto 0;
  padding:0 1.25rem;
  display:grid;
  grid-template-columns:1fr;
  gap:1.5rem;
}
.layout > *{ animation:screenSlideIn .32s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes screenSlideIn{ from{ opacity:0; transform:translateX(18px) scale(.98); } to{ opacity:1; transform:translateX(0) scale(1); } }
@media (prefers-reduced-motion: reduce){ .layout > *{ animation:none; } }

.back-btn{
  display:inline-flex; align-items:center; gap:.3rem; margin-bottom:.9rem;
  font-family:'Quicksand',sans-serif; font-weight:800; font-size:.85rem;
  padding:.45rem .9rem; border-radius:16px; border:3px solid var(--ink); cursor:pointer;
  background:#fff; color:var(--ink); box-shadow:2px 3px 0 var(--ink);
}
.back-btn:active{ transform:translate(2px,3px); box-shadow:0 0 0 var(--ink); }

.form-card{
  background:#FFFDF8;
  border:3px solid var(--wood);
  border-radius:22px;
  padding:1.5rem;
  box-shadow:0 10px 0 -4px rgba(139,90,43,.18), 0 14px 30px rgba(139,90,43,.16);
}
.form-intro{
  font-family:'Quicksand',sans-serif; font-size:.85rem; color:var(--ink-soft);
  margin:0 0 1.2rem; line-height:1.5;
}
.field{ margin-bottom:1.35rem; border:none; padding:0;}
.field > span, .field legend{
  display:block; font-family:'Quicksand',sans-serif; font-weight:700;
  font-size:.82rem; color:var(--coral); margin-bottom:.55rem; padding:0;
}
.field > span em{ font-style:normal; font-weight:500; color:var(--ink-soft); }
.field-hint{
  margin:-.9rem 0 1.35rem; font-family:'Quicksand',sans-serif; font-size:.76rem;
  color:var(--ink-soft); line-height:1.4;
}
.field input{
  width:100%; padding:.7rem .85rem; border-radius:14px; border:2px solid var(--coral-soft);
  background:#FFFAF2; color:var(--ink); font-family:'Cormorant Garamond',serif; font-size:1rem;
}
.field input:focus{ outline:2px solid var(--coral); outline-offset:1px; }
.field input::placeholder{ color:#C7AF98; }

.chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
.lang-switch{ display:flex; justify-content:center; gap:.4rem; margin-bottom:1rem; }

.library-toggle{
  margin-top:1.1rem; font-family:'Quicksand',sans-serif; font-weight:700; font-size:.82rem;
  padding:.45rem .9rem; border-radius:999px; border:2px solid var(--sky-soft);
  background:#fff; color:var(--ink-soft); cursor:pointer;
}
.library-toggle:hover{ background:var(--sky-soft); color:var(--ink); }

.library-overlay{
  position:fixed; inset:0; background:rgba(74,54,38,.45); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:1.25rem;
}
.library-panel{
  background:#FFFDF8; border:3px solid var(--wood); border-radius:20px;
  padding:1.5rem; max-width:480px; width:100%; max-height:80vh; overflow-y:auto;
  box-shadow:0 20px 40px rgba(139,90,43,.3);
}
.library-panel-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem; }
.library-panel-header h2{ font-family:'Cormorant Garamond',serif; font-size:1.2rem; color:var(--ink); margin:0; }
.library-close{
  font-family:'Quicksand',sans-serif; font-weight:600; font-size:.78rem; white-space:nowrap;
  padding:.3rem .7rem; border-radius:999px; border:2px solid var(--coral-soft); background:#fff; cursor:pointer;
}
.library-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.7rem; }
.library-item{
  display:flex; flex-direction:column; gap:.55rem;
  padding:.7rem .9rem; border-radius:14px; background:var(--parchment); border:2px solid var(--parchment-edge);
}
.library-item-info{ display:flex; flex-direction:column; gap:.15rem; min-width:0; }
.library-item-info strong{ font-family:'Cormorant Garamond',serif; font-size:.92rem; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; display:block; }
.library-item-date{ font-family:'Quicksand',sans-serif; font-size:.7rem; color:var(--ink-soft); }
.library-item-actions{ display:flex; gap:.4rem; flex-wrap:wrap; }
.library-item-actions button{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.72rem;
  padding:.35rem .6rem; border-radius:999px; border:2px solid var(--forest); background:#fff; color:var(--forest); cursor:pointer;
}
.library-delete{ border-color:var(--coral) !important; color:var(--coral) !important; }
.chip--sm{ padding:.3rem .7rem; font-size:.72rem; }
.chip{
  font-family:'Quicksand',sans-serif; font-weight:800; font-size:.82rem;
  padding:.45rem .9rem; border-radius:16px; border:3px solid var(--ink);
  background:#FFFAF2; color:var(--ink); cursor:pointer;
  box-shadow:2px 3px 0 var(--ink); transition:transform .08s ease, box-shadow .08s ease;
}
.chip:hover{ background:var(--butter); }
.chip:active{ transform:translate(2px,3px); box-shadow:0 0 0 var(--ink); }
.chip--active{ background:var(--coral); color:#fff; }
.chip:focus-visible{ outline:2px solid var(--sky-soft); outline-offset:2px; }

.cta{
  width:100%; font-family:'Quicksand',sans-serif; font-weight:800; font-size:1.05rem;
  padding:.9rem 1rem; border-radius:18px; border:3px solid var(--ink); cursor:pointer;
  background:var(--coral);
  color:#fff; box-shadow:3px 4px 0 var(--ink);
  transition:transform .08s ease, box-shadow .08s ease;
}
.cta:hover{ background:var(--butter); color:var(--ink); }
.cta:active{ transform:translate(3px,4px); box-shadow:0 0 0 var(--ink); }
.cta:focus-visible{ outline:2px solid var(--sky-soft); outline-offset:2px; }
.cta:disabled{ opacity:.7; cursor:wait; }

.gen-error{
  font-family:'Quicksand',sans-serif; font-size:.82rem; color:#8A4B2A;
  background:rgba(242,137,95,.14); border:1px solid rgba(242,137,95,.4);
  border-radius:10px; padding:.6rem .8rem; margin-bottom:1rem;
}

.page-wrap{ perspective:1400px; }
.page{
  background:var(--parchment);
  color:var(--ink);
  border-radius:14px;
  border:3px solid var(--wood);
  box-shadow:0 10px 0 -3px rgba(139,90,43,.2), 0 20px 34px rgba(139,90,43,.22), inset 0 0 0 6px rgba(255,255,255,.4);
  padding:2rem 1.9rem;
  min-height:420px;
  transform-style:preserve-3d;
  transition:transform .26s ease;
  font-family:'Cormorant Garamond',serif;
}
.page--flip{ transform:rotateY(8deg) scale(.985); opacity:.85; }
@media (prefers-reduced-motion: reduce){ .page{ transition:none; } .page--flip{ transform:none; } }

.book-loader{ text-align:center; padding:3.5rem 1rem; }
.book-loader-book{
  position:relative; width:104px; height:74px; margin:0 auto 1.4rem;
  perspective:340px;
}
.book-cover{
  position:absolute; top:0; width:50px; height:74px;
  background:var(--parchment); border:2px solid var(--wood);
}
.book-cover.left{ left:2px; border-radius:8px 2px 2px 8px; }
.book-cover.right{ right:2px; border-radius:2px 8px 8px 2px; }
.flip-page{
  position:absolute; top:2px; right:2px; width:48px; height:70px;
  background:#FFFDF6; border:2px solid var(--wood-dark); border-radius:2px 8px 8px 2px;
  transform-origin:left center; animation:pageFlip 1.5s ease-in-out infinite;
}
.flip-page.p2{ animation-delay:.25s; }
.flip-page.p3{ animation-delay:.5s; }
@keyframes pageFlip{
  0%, 100%{ transform:rotateY(0deg); opacity:1; }
  50%{ transform:rotateY(-165deg); opacity:.55; }
}
.book-loader-text{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.92rem; color:var(--ink-soft);
}
@media (prefers-reduced-motion: reduce){
  .flip-page{ animation:none; }
}

.page-empty{ text-align:center; padding:3rem 1rem; color:var(--ink-soft); }
.page-empty-glyph{ font-size:2.2rem; display:block; margin-bottom:.75rem; }
.page-empty .muted{ font-family:'Quicksand',sans-serif; font-size:.85rem; color:#B29A82; }

.story-block{ margin-bottom:1.1rem; }
.panel{
  width:100%; height:auto; aspect-ratio:320/165; display:block;
  border-radius:14px; margin-bottom:.6rem;
  box-shadow:0 4px 12px rgba(139,90,43,.22), inset 0 0 0 4px rgba(231,183,80,.45);
  border:2px solid #fff;
}
.ai-image-wrap{ position:relative; width:100%; }
.ai-image{ object-fit:cover; }
.ai-image-loading{
  width:100%; aspect-ratio:320/165; border-radius:14px; margin-bottom:.6rem;
  border:2px solid #fff; box-shadow:0 4px 12px rgba(139,90,43,.22);
  background:linear-gradient(100deg, var(--wall-a) 30%, var(--butter) 50%, var(--wall-a) 70%);
  background-size:250% 100%; animation:shimmer 1.6s ease-in-out infinite;
  display:flex; align-items:center; justify-content:center;
}
.ai-image-spark{ font-size:1.8rem; animation:pulse 1.2s ease-in-out infinite; }
@keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
@keyframes pulse{ 0%,100%{transform:scale(1); opacity:.7;} 50%{transform:scale(1.25); opacity:1;} }
@media (prefers-reduced-motion: reduce){
  .ai-image-loading{ animation:none; }
  .ai-image-spark{ animation:none; }
}

.page-toolbar{ display:flex; flex-direction:column; gap:.6rem; margin:1.5rem 0 .5rem; }
.page-toolbar .listen{ width:100%; text-align:center; }
.continue-btn{ font-size:.95rem; padding:.75rem 1rem; }
.full-listen-btn{ display:block; width:fit-content; margin:0 auto 1.1rem; }
.toolbar-row{ display:flex; gap:.6rem; }
.toolbar-row .listen{ flex:1; }

.profile-switch{ display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem; margin-top:.9rem; }
.profile-group{ display:flex; align-items:center; gap:.2rem; }
.profile-icon-btn{
  border:none; background:transparent; cursor:pointer; font-size:.85rem;
  padding:.15rem .25rem; border-radius:8px; line-height:1;
}
.profile-icon-btn:hover{ background:rgba(242,137,95,.15); }
.profile-add-form{ display:flex; gap:.35rem; align-items:center; }
.profile-add-form input{
  font-family:'Quicksand',sans-serif; font-size:.78rem; padding:.3rem .6rem;
  border-radius:999px; border:2px solid var(--coral-soft); background:#FFFAF2; color:var(--ink);
}
.profile-add-form button{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.72rem;
  padding:.3rem .6rem; border-radius:999px; border:2px solid var(--forest); background:#fff; color:var(--forest); cursor:pointer;
}
.library-fav{ border-color:var(--butter) !important; color:#8A6A1A !important; }

.premium-chip{ background:linear-gradient(135deg, var(--butter), var(--coral)) !important; color:#fff !important; }
.premium-list{ list-style:none; margin:0 0 1.2rem; padding:0; display:flex; flex-direction:column; gap:.6rem; }
.premium-list li{ font-family:'Cormorant Garamond',serif; font-size:.96rem; line-height:1.4; }
.premium-active-note{
  font-family:'Quicksand',sans-serif; font-weight:700; text-align:center; color:var(--forest);
  background:rgba(107,143,94,.12); border-radius:10px; padding:.7rem; margin-bottom:.8rem;
}
.premium-reset-btn{ background:#fff !important; color:var(--ink-soft) !important; }

.premium-plans{ display:flex; gap:.7rem; margin-bottom:1.1rem; }
.premium-plan{
  flex:1; position:relative; display:flex; flex-direction:column; align-items:center; gap:.15rem;
  padding:.9rem .6rem; border-radius:16px; border:3px solid var(--wood);
  background:#FFFAF2; cursor:pointer; font-family:'Quicksand',sans-serif;
}
.premium-plan--active{ border-color:var(--coral); background:#FFF0E8; box-shadow:2px 3px 0 var(--coral); }
.premium-plan-name{ font-weight:700; font-size:.82rem; color:var(--ink-soft); }
.premium-plan-price{ font-weight:800; font-size:1.25rem; color:var(--ink); }
.premium-plan-price small{ font-weight:600; font-size:.7rem; color:var(--ink-soft); }
.premium-plan-note{ font-size:.7rem; color:var(--ink-soft); }
.premium-plan-badge{
  position:absolute; top:-.6rem; background:var(--coral); color:#fff; font-size:.65rem; font-weight:800;
  padding:.15rem .5rem; border-radius:999px;
}
.voice-picker{
  font-family:'Quicksand',sans-serif; font-weight:600; font-size:.78rem;
  padding:.4rem .6rem; border-radius:999px; border:2px solid var(--forest);
  background:#fff; color:var(--forest); cursor:pointer; max-width:150px;
}
.listen{
  font-family:'Quicksand',sans-serif; font-weight:800; font-size:.8rem;
  padding:.4rem .8rem; border-radius:16px; border:3px solid var(--ink);
  background:#fff; color:var(--ink); cursor:pointer;
  box-shadow:2px 3px 0 var(--ink); transition:transform .08s ease, box-shadow .08s ease;
}
.listen:hover{ background:var(--sky-soft); }
.listen:active{ transform:translate(2px,3px); box-shadow:0 0 0 var(--ink); }
.fav-toggle{ background:#fff; }
.fav-toggle--active{ background:var(--butter); }

.story-title{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:700;
  font-size:1.9rem; line-height:1.2; text-align:center; color:var(--ink);
  margin:0 0 1.1rem;
}

.chapter{ margin-bottom:1.3rem; }
.chapter-title{
  font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:1.1rem;
  color:var(--forest); margin:0 0 .65rem; padding-bottom:.3rem;
  border-bottom:2px dotted rgba(107,143,94,.4);
}

.morale{
  margin-top:1.6rem; padding:1rem 1.25rem; border-radius:14px;
  background:rgba(190,227,240,.25); border:2px dashed var(--sky-soft);
}
.morale-title{
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.8rem; color:var(--forest);
  margin:0 0 .5rem; text-transform:uppercase; letter-spacing:.06em;
}
.morale ul{ margin:0; padding-left:1.15rem; }
.morale li{ font-family:'Cormorant Garamond',serif; font-size:.98rem; line-height:1.6; margin-bottom:.35rem; }

.report-btn{
  display:block; text-align:center; margin-top:1.2rem;
  font-family:'Quicksand',sans-serif; font-weight:700; font-size:.8rem; color:var(--ink-soft);
  text-decoration:underline; text-underline-offset:2px; cursor:pointer;
}
.report-btn:hover{ color:var(--coral); }

.ask-more{
  margin-top:1rem; padding:1rem 1.25rem; border-radius:14px;
  background:rgba(242,137,95,.08); border:2px dashed var(--coral-soft);
}
.qa-item{ margin-bottom:.7rem; }
.qa-q{ font-family:'Quicksand',sans-serif; font-weight:700; font-size:.88rem; color:var(--ink); margin:0 0 .2rem; }
.qa-a{ font-family:'Cormorant Garamond',serif; font-size:.95rem; line-height:1.5; color:var(--ink-soft); margin:0; }
.ask-more-form{ display:flex; gap:.5rem; margin-top:.6rem; flex-wrap:wrap; }
.ask-more-form input{
  flex:1; min-width:140px; padding:.55rem .8rem; border-radius:14px;
  border:2px solid var(--coral-soft); background:#FFFAF2; color:var(--ink); font-family:'Cormorant Garamond',serif;
}
.ask-more-form button{
  font-family:'Quicksand',sans-serif; font-weight:800; font-size:.85rem;
  padding:.55rem 1rem; border-radius:14px; border:3px solid var(--ink); cursor:pointer;
  background:var(--coral); color:#fff; box-shadow:2px 3px 0 var(--ink);
}
.ask-more-form button:disabled{ opacity:.6; cursor:default; }

.story-first{ font-size:1.22rem; line-height:1.8; margin:0 0 1rem; }
.story-p{ font-size:1.22rem; line-height:1.8; margin:0 0 1rem; }
.drop-cap{
  float:left; font-family:'Cormorant Garamond',serif; font-weight:700; font-style:italic;
  font-size:3.4rem; line-height:.82; padding:.05em .08em 0 0; color:var(--coral);
  text-shadow:1px 1px 0 rgba(0,0,0,.06);
}

.foot{
  max-width:980px; margin:2.5rem auto 0; padding:0 1.25rem;
  font-family:'Quicksand',sans-serif; font-size:.78rem; color:var(--ink-soft); text-align:center;
}
`;

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
